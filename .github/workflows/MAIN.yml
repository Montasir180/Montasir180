
# GitHub Action to generate a contribution graph snake 🐍

name: Generate Snake

on:
  # Run automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

# Give GitHub Actions permission to publish generated files
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate the contribution graph snake
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Montasir180
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake.svg

      # Publish generated files to the output branch
      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

